<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#176b45">
  <title>视频下载器</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#urlInput">跳转到视频链接</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="视频下载器首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 7v10m-4-4 4 4 4-4"/></svg>
        </span>
        <span>视频下载器</span>
      </a>
      <div class="header-tools">
        <span id="serviceStatus" class="service-status" role="status" data-state="checking"><i aria-hidden="true"></i><span>正在连接</span></span>
        <button class="button button-secondary header-action" id="openFolderButton" type="button" title="打开下载文件夹">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h4l3 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 9h18"/></svg>
          <span class="button-label">打开下载文件夹</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="resolver" class="resolver" aria-labelledby="resolverTitle">
      <div class="section-heading">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <h1 id="resolverTitle">新建下载</h1>
      </div>
      <form id="resolveForm" class="resolve-form" novalidate>
        <label class="sr-only" for="urlInput">视频页面或媒体链接</label>
        <div class="url-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>
          <input id="urlInput" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="粘贴视频页面或媒体链接" title="支持视频网页、MP4 直链与 M3U8 媒体链接" required>
          <button id="clearUrlButton" class="field-button" type="button" aria-label="清除链接" title="清除链接" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
          <button id="pasteButton" class="paste-button" type="button" title="从剪贴板粘贴链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H5v16h14V5h-3M8 12h8M8 16h5"/></svg><span>粘贴</span></button>
        </div>
        <button id="resolveButton" class="button button-primary" type="submit">
          <span>解析视频</span><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
        </button>
      </form>
      <p class="resolve-hint">下载后分别保存 MP4 和可提取的 SRT。多条字幕按语言导出；画面中的字幕无法直接分离。</p>
      <div id="statusRegion" class="status-region" aria-live="polite" aria-atomic="true" hidden>
        <span class="status-indicator" aria-hidden="true"></span>
        <div class="status-copy"><p id="statusTitle" class="status-title"></p><p id="statusDetail" class="status-detail"></p></div>
        <button id="browserVerifyButton" class="button button-secondary status-action" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="14" x="3" y="4" rx="2"/><path d="M8 20h8M12 18v2"/></svg><span>在浏览器中验证</span>
        </button>
      </div>
    </section>

    <section id="resultsSection" class="results" aria-labelledby="resultsTitle" hidden>
      <header class="results-header"><h2 id="resultsTitle"></h2><p id="resultsCount"></p></header>
      <div id="mediaList" class="media-list"></div>
    </section>

    <section id="historySection" class="history" aria-labelledby="historyTitle">
      <header class="history-header">
        <div class="history-heading"><h2 id="historyTitle">下载记录</h2><span id="historyCount" class="count-badge">0 条记录</span></div>
        <button id="clearHistoryButton" class="button button-quiet" type="button" title="仅清空已完成和失败的记录，保留下载文件" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg><span>清空记录</span></button>
      </header>
      <div class="history-toolbar">
        <div id="historyFilters" class="history-filters" role="group" aria-label="按下载状态筛选">
          <button type="button" data-filter="all" aria-pressed="true">全部 <span data-count="all">0</span></button>
          <button type="button" data-filter="active" aria-pressed="false">进行中 <span data-count="active">0</span></button>
          <button type="button" data-filter="completed" aria-pressed="false">已完成 <span data-count="completed">0</span></button>
          <button type="button" data-filter="failed" aria-pressed="false">失败 <span data-count="failed">0</span></button>
        </div>
        <label class="history-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">搜索下载记录</span><input id="historySearch" type="search" placeholder="搜索下载记录" autocomplete="off"></label>
      </div>
      <div id="historyEmpty" class="history-empty">
        <h3 id="historyEmptyTitle">暂无下载记录</h3><p id="historyEmptyDetail" hidden></p>
        <button id="emptyAction" class="button button-secondary" type="button" hidden><span>查看全部记录</span></button>
      </div>
      <p id="historyMatchCount" class="sr-only" role="status" aria-live="polite"></p>
      <div id="historyList" class="history-list"></div>
    </section>

  </main>

  <template id="mediaTemplate">
    <article class="media-row">
      <div class="media-main"><div class="media-index" aria-hidden="true"></div><div class="media-copy"><h3 class="media-title"></h3><p class="media-meta"></p></div><button class="button button-primary media-download" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg><span>下载</span></button></div>
      <div class="task-panel" hidden><div class="task-line"><span class="task-status">准备下载</span><span class="task-metric"></span></div><div class="progress-track" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="progress-value"></span></div><p class="task-error" hidden></p><p class="subtitle-note" role="status" hidden></p><button class="button button-secondary task-toggle" type="button" hidden><span>暂停下载</span></button><div class="task-actions" hidden><a class="button button-primary file-download" href="#"><span>保存 MP4</span></a><span class="subtitle-links"></span><button class="button button-secondary row-open-folder" type="button"><span>打开下载文件夹</span></button></div></div>
    </article>
  </template>
  <template id="historyTemplate">
    <article class="history-row">
      <div class="history-main"><span class="history-file-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/></svg></span><div class="history-copy"><h3 class="history-title"></h3><p class="history-meta"></p></div><span class="history-status"></span></div>
      <div class="history-progress"><div class="task-line"><span class="history-state"></span><span class="history-metric task-metric"></span></div><div class="progress-track" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="progress-value"></span></div></div>
      <p class="history-error" hidden></p><p class="subtitle-note" role="status" hidden></p><button class="button button-secondary history-toggle" type="button" hidden><span>暂停下载</span></button><div class="history-actions" hidden><a class="button button-primary history-download" href="#"><span>保存 MP4</span></a><span class="subtitle-links"></span><button class="button button-secondary history-open-folder" type="button"><span>打开文件夹</span></button><button class="button button-danger icon-button history-delete" type="button" aria-label="删除此条下载记录" title="删除此条下载记录" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg></button></div>
    </article>
  </template>
  <script src="/app.js" type="module"></script>
</body>
</html>
