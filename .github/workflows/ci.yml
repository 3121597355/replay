name: CI

on:
  push:
    branches: [main, feature/video-downloader]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downloader:
    name: Downloader checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Downloader unit checks
        working-directory: services/video-downloader
        run: node --test tests/*.test.mjs
      - name: Ensure media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Real video and subtitle separation
        working-directory: services/video-downloader
        run: node scripts/test-subtitles-real.mjs

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit checks
        run: |
          npx tsx scripts/test-pairing.ts
          npx tsx scripts/test-srt-export.ts
          npx tsx scripts/test-download-import.ts
